<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Presupuesto Mensual</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-500 to-purple-600 min-h-screen py-12">
    <div class="max-w-md mx-auto bg-white shadow-2xl rounded-3xl p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">💰 Presupuesto Mensual</h1>
        
        <form id="budgetForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2">User ID (default 1)</label>
                <input type="number" id="userId" value="1" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2">Mes (YYYY-MM)</label>
                <input type="month" id="month" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2">Categoría (opcional: General)</label>
                <input type="text" id="category" placeholder="ej. Comida, Transporte" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-2">Monto ($)</label>
                <input type="number" id="amount" step="0.01" min="0" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <button type="submit" class="w-full bg-green-600 text-white py-3 px-6 rounded-xl font-semibold hover:bg-green-700 transition-all duration-200 shadow-lg">
                📝 Registrar Presupuesto
            </button>
        </form>
        
        <div id="result" class="mt-6 p-4 bg-gray-100 rounded-lg hidden"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        
        document.getElementById('budgetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                user_id: parseInt(document.getElementById('userId').value),
                month: document.getElementById('month').value,
                category: document.getElementById('category').value || null,
                amount: parseFloat(document.getElementById('amount').value)
            };
            
            try {
                const res = await fetch(`${API_BASE}/presupuestos/`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(formData)
                });
                const data = await res.json();
                
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'mt-6 p-4 bg-green-100 border-l-4 border-green-500 rounded-lg';
                resultDiv.innerHTML = `<strong>✅ Éxito!</strong><br>${data.result.message}<br><small>Presupuestos actualizados.</small>`;
                resultDiv.classList.remove('hidden');
                document.getElementById('budgetForm').reset();
                document.getElementById('userId').value = 1;
            } catch (err) {
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'mt-6 p-4 bg-red-100 border-l-4 border-red-500 rounded-lg';
                resultDiv.innerHTML = `<strong>❌ Error:</strong><br>${err.message || 'Verifica servidor y datos.'}`;
                resultDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
