<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Gasto Recurrente</title>
    <link rel="stylesheet" href="css/usuario_style.css">
    <link rel="stylesheet" href="css/gasto_recurrente_style.css"> 
</head>
<body>
    <div class="dashboard-container">
        
        <nav class="sidebar">
            <h2>Mi Sistema</h2>
            <a href="dashboard.html" class="menu-item active">👤 Mi Perfil</a>
            <a href="categoria_index.html" class="menu-item">📁 Categorías</a>
            <a href="crear_gasto_recurrente.html" class="menu-item">➕ Gasto Recurrente</a>
            <a href="listar_gastos_recurrentes.html" class="menu-item">📋 Lista Gastos</a>
            <a href="movimientos_mes.html" class="menu-item">📅 Movimientos</a>
            <a href="registrar_ingreso.html" class="menu-item">💰 Registrar Movimiento</a>
            <a href="listado_gastos.html" class="menu-item">💸 Mis Gastos</a>
            <a href="presupuesto.html" class="menu-item">💵 Presupuestos</a>
            <a href="tablero_control.html" class="menu-item active">📊 Monitoreo</a>
            
            <div style="flex-grow: 1;"></div>
            <button onclick="logout()" class="btn btn-outline" style="width: 100%;">Cerrar Sesión</button>
        </nav>

        <div class="main-content">
            
            <div class="contenedor-dos-columnas">
                
                <div class="form-container oculto" id="panel-formulario">
                    <h3 style="text-align: center; color: var(--primary, #0088cc); margin-top: 0;">Gasto Recurrente</h3>
                    <form id="formGasto">
                        <input type="text" id="concepto" placeholder="Concepto" required>
                        <input type="number" id="monto" placeholder="Monto" required>
                        <input type="date" id="fechaInicio" required>
                        <select id="frecuencia">
                            <option value="mensual">Mensual</option>
                            <option value="quincenal">Quincenal</option>
                            <option value="anual">Anual</option>
                        </select>
                        
                        <button type="submit" id="btnGuardarGasto" style="width: 100%; padding: 12px; background-color: var(--primary, #0088cc); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px;">
                            Guardar Gasto
                        </button>
                        
                        <button type="button" onclick="ocultarFormulario()" style="width: 100%; padding: 12px; background-color: #6b7280; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;">
                            Cerrar / Cancelar
                        </button>

                        <p id="mensaje"></p>
                    </form>
                </div>

                <div class="tabla-container">
                    <h3 style="text-align: center; color: var(--primary, #0088cc); margin-top: 0;">Mis Gastos Recurrentes</h3>
                    <table class="tabla-gastos">
                        <thead>
                            <tr>
                                <th>Concepto</th>
                                <th>Monto</th>
                                <th>Frecuencia</th>
                                <th style="text-align: center;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-recurrentes">
                            </tbody>
                    </table>

                    <button id="btnMostrarFormulario" onclick="mostrarFormulario()" style="width: 100%; padding: 12px; background-color: #10b3b9; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 25px; font-size: 1rem;">
                        ➕ Agregar Nuevo Gasto Recurrente
                    </button>
                </div>

            </div> 
        </div> 
    </div>
    <script src="js/crear_gasto_recurrente.js"></script>
    <script>function logout(){ localStorage.removeItem("token"); window.location.href="usuario_index.html"; }</script>
</body>
</html>
