<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Gasto Recurrente</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #mensaje {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Crear Gasto</h2>

    <form id="formGasto">
        <input type="text" id="concepto" placeholder="Concepto" required>

        <input type="number" id="monto" placeholder="Monto" required>

        <input type="date" id="fechaInicio" required>

        <select id="frecuencia">
            <option value="mensual">Mensual</option>
            <option value="semanal">Semanal</option>
        </select>

        <input type="number" id="idCliente" placeholder="ID Cliente" required>

        <button type="submit">Guardar</button>
    </form>

    <p id="mensaje"></p>
</div>

<script src="js/crear_gasto_recurrente.js"></script>

</body>
</html>
