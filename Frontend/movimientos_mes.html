<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Movimientos por Mes</title>
    <link rel="stylesheet" href="css/usuario_style.css">
    <style>
        body { display: block !important; background-color: var(--bg-color); margin: 0; }
        .dashboard-container { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background-color: var(--card-bg); padding: 25px 20px; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        .sidebar h2 { color: var(--primary); margin-bottom: 30px; text-align: center; }
        .menu-item { display: block; padding: 12px 15px; color: var(--text-main); text-decoration: none; border-radius: 8px; margin-bottom: 10px; font-weight: 500; }
        .menu-item:hover, .menu-item.active { background-color: var(--bg-color); color: var(--primary); }
        .main-content { flex: 1; padding: 40px; }

        .selector-card { background: white; padding: 20px; border-radius: 10px; display: flex; gap: 15px; align-items: flex-end; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .resumen { display: flex; gap: 20px; margin-bottom: 20px; }
        .resumen-item { flex: 1; padding: 15px; background: white; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .ingreso { color: #10b981; font-weight: bold; }
        .egreso { color: #ef4444; font-weight: bold; }
        table { width: 100%; background: white; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <h2>Mi Sistema</h2>
            <a href="dashboard.html" class="menu-item">👤 Mi Perfil</a>
            <a href="categoria_index.html" class="menu-item">📁 Categorías</a>
            <a href="crear_gasto_recurrente.html" class="menu-item">➕ Crear Gasto</a>
            <a href="listar_gastos_recurrentes.html" class="menu-item">📋 Lista Gastos</a>
            <a href="movimientos_mes.html" class="menu-item active">📅 Movimientos</a>
            <a href="registrar_ingreso.html" class="menu-item">💰 Registrar Ingreso</a>
            <div style="flex-grow: 1;"></div>
            <button onclick="logout()" class="btn btn-outline">Cerrar Sesión</button>
        </nav>

        <main class="main-content">
            <h2>Reporte de Movimientos</h2>
            <div class="selector-card">
                <div style="flex:1">
                    <label>Mes</label>
                    <select id="selectMes">
                        <option value="1">Enero</option><option value="2">Febrero</option>
                        <option value="3">Marzo</option><option value="4">Abril</option>
                        <option value="5">Mayo</option><option value="6">Junio</option>
                        <option value="7">Julio</option><option value="8">Agosto</option>
                        <option value="9">Septiembre</option><option value="10">Octubre</option>
                        <option value="11">Noviembre</option><option value="12">Diciembre</option>
                    </select>
                </div>
                <div style="flex:1">
                    <label>Año</label>
                    <input type="number" id="inputAnio" value="2025">
                </div>
                <button class="btn" onclick="cargarMovimientos()">Buscar</button>
            </div>

            <div class="resumen" id="resumen" style="display:none">
                <div class="resumen-item">Total Ingresos: <span id="total-ingresos" class="ingreso"></span></div>
                <div class="resumen-item">Total Egresos: <span id="total-egresos" class="egreso"></span></div>
                <div class="resumen-item">Balance: <span id="balance"></span></div>
            </div>

            <div id="contenido-tabla"></div>
        </main>
    </div>
    <script src="js/movimientos_mes.js"></script>
    <script>function logout(){ localStorage.removeItem("token"); window.location.href="usuario_index.html"; }</script>
</body>
</html>
