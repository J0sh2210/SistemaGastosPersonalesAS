<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Ingreso - Mi Sistema</title>
    <link rel="stylesheet" href="css/usuario_style.css">
    <link rel="stylesheet" href="css/ingreso_style.css">
    <style>
        /* Estilos base para la integración */
        body { display: block !important; background-color: var(--bg-color); margin: 0; }
        .dashboard-container { display: flex; min-height: 100vh; }
        
        .sidebar { 
            width: 260px; background-color: var(--card-bg); padding: 25px 20px; 
            display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.05); 
        }
        .sidebar h2 { color: var(--primary); margin-bottom: 30px; text-align: center; }
        .menu-item { 
            display: block; padding: 12px 15px; color: var(--text-main); 
            text-decoration: none; border-radius: 8px; margin-bottom: 10px; font-weight: 500; 
        }
        .menu-item:hover, .menu-item.active { background-color: var(--bg-color); color: var(--primary); }
        
        .main-content { flex: 1; padding: 50px; display: flex; justify-content: center; align-items: flex-start; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <nav class="sidebar">
            <h2>Mi Sistema</h2>
            <a href="dashboard.html" class="menu-item">👤 Mi Perfil</a>
            <a href="categoria_index.html" class="menu-item">📁 Categorías</a>
            <a href="crear_gasto_recurrente.html" class="menu-item">➕ Crear Gasto</a>
            <a href="listar_gastos_recurrentes.html" class="menu-item">📋 Lista Gastos</a>
            <a href="movimientos_mes.html" class="menu-item">📅 Movimientos</a>
            <a href="registrar_ingreso.html" class="menu-item">💰 Registrar Ingreso</a>
            
            <div style="flex-grow: 1;"></div>
            <button onclick="logout()" class="btn btn-outline" style="width: 100%;">Cerrar Sesión</button>
        </nav>

        <main class="main-content">
            <div class="container-ingreso">
                <h2>Registrar Nuevo Ingreso</h2>
                <p class="subtitle">Añade tus entradas de dinero para actualizar tu balance.</p>

                <form id="form-ingreso">
                    <div class="form-group">
                        <label for="ing-concepto">Concepto</label>
                        <input type="text" id="ing-concepto" placeholder="Ej: Sueldo mensual, Venta de garage..." required>
                    </div>

                    <div class="form-group">
                        <label for="ing-monto">Monto (Q)</label>
                        <input type="number" step="0.01" id="ing-monto" placeholder="0.00" required>
                    </div>

                    <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 20px;">
                        ✔ Guardar Ingreso
                    </button>
                </form>

                <p id="ing-msg" class="msg-status"></p>
            </div>
        </main>
    </div>

    <script src="js/ingreso_config.js"></script>
    <script>
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "usuario_index.html";
        }
    </script>
</body>
</html>
