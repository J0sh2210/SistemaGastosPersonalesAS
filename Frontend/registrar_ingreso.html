<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Movimiento</title>
    <link rel="stylesheet" href="css/usuario_style.css">
    <link rel="stylesheet" href="css/ingreso_style.css"> 
</head>
<body>
    <div class="dashboard-container">
        
        <nav class="sidebar">
            <h2>Mi Sistema</h2>
            <a href="dashboard.html" class="menu-item active">👤 Mi Perfil</a>
            <a href="categoria_index.html" class="menu-item">📁 Categorías</a>
            <a href="crear_gasto_recurrente.html" class="menu-item">➕ Gasto Recurrente</a>
            <a href="movimientos_mes.html" class="menu-item">📅 Movimientos</a>
            <a href="registrar_ingreso.html" class="menu-item active">💰 Registrar Movimiento</a>
            <a href="presupuesto.html" class="menu-item">💵 Presupuestos</a>
            <a href="metas_ahorro.html" class="menu-item">🎯 Metas de Ahorro</a>
            <a href="tablero_control.html" class="menu-item">📊 Monitoreo</a>
            
            <div style="flex-grow: 1;"></div>
            <button onclick="logout()" class="btn btn-outline" style="width: 100%;">Cerrar Sesión</button>
        </nav>

        <div class="main-content">
            
            <div class="contenedor-dos-columnas">
                
                <div class="form-container oculto" id="panel-formulario">
                    <h3 style="text-align: center; color: var(--primary, #0088cc); margin-top: 0;">Registrar Movimiento</h3>
                    <form id="formMovimiento">
                        <input type="text" id="concepto" placeholder="Concepto" required>
                        <input type="number" id="monto" placeholder="Monto" required>
                        <select id="categoria" required>
                            <option value="">Selecciona una categoría</option>
                        </select>
                        <select id="tipo" required>
                            <option value="1">Ingreso</option>
                            <option value="2">Egreso</option>
                        </select>
                        
                        <!-- Este campo solo será visible cuando se selecciona "Ahorro inversión" -->
                        <select id="meta" style="display:none;" data-obligatorio="false">
                            <option value="">Selecciona una meta de ahorro (opcional)</option>
                        </select>
                        
                        <button type="submit" id="btnGuardarMovimiento" style="width: 100%; padding: 12px; background-color: var(--primary, #0088cc); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px;">
                            Guardar Movimiento
                        </button>
                        
                        <button type="button" onclick="ocultarFormulario()" style="width: 100%; padding: 12px; background-color: #6b7280; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;">
                            Cerrar / Cancelar
                        </button>

                        <p id="mensaje"></p>
                    </form>
                </div>

                <div class="tabla-container">
                    <h3 style="text-align: center; color: var(--primary, #0088cc); margin-top: 0;">Mis Movimientos</h3>
                    <table class="tabla-movimientos">
                        <thead>
                            <tr>
                                <th>Concepto</th>
                                <th>Monto</th>
                                <th>Categoría</th>
                                <th>Tipo</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-movimientos">
                            </tbody>
                    </table>

                    <button id="btnMostrarFormulario" onclick="mostrarFormulario()" style="width: 100%; padding: 12px; background-color: #10b3b9; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 25px; font-size: 1rem;">
                        ➕ Agregar Nuevo Movimiento
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="js/ingreso_config.js"></script>
    <script>function logout(){ localStorage.removeItem("token"); window.location.href="usuario_index.html"; }</script>
</body>
</html>
