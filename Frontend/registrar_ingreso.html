<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Movimiento</title>
    <link rel="stylesheet" href="css/usuario_style.css">
    <link rel="stylesheet" href="css/ingreso_style.css"> 
</head>
<body>
    <div class="dashboard-container">
        
        <nav class="sidebar">
            <h2>Mi Sistema</h2>
            <a href="dashboard.html" class="menu-item active">👤 Mi Perfil</a>
            <a href="categoria_index.html" class="menu-item">📁 Categorías</a>
            <a href="crear_gasto_recurrente.html" class="menu-item">➕ Gasto Recurrente</a>
            <a href="listar_gastos_recurrentes.html" class="menu-item">📋 Lista Gastos</a>
            <a href="movimientos_mes.html" class="menu-item">📅 Movimientos</a>
            <a href="registrar_ingreso.html" class="menu-item active">💰 Registrar Movimiento</a>
            <a href="listado_gastos.html" class="menu-item">💸 Mis Gastos</a>
            <a href="presupuesto.html" class="menu-item">💵 Presupuestos</a>
            <a href="tablero_control.html" class="menu-item">📊 Monitoreo</a>
            
            <div style="flex-grow: 1;"></div>
            <button onclick="logout()" class="btn btn-outline" style="width: 100%;">Cerrar Sesión</button>
        </nav>

        <div class="main-content">
            
            <div class="contenedor-dos-columnas">
                
                <div class="form-container" id="panel-formulario" style="display: none;">
                    <h2 style="text-align: center; color: var(--primary, #0088cc); margin-top: 0;">Registrar Movimiento</h2>
                    <p class="subtitle">Ingresa los datos del nuevo movimiento</p>
                    
                    <form id="formMovimiento">
                        <div class="form-group">
                            <label for="concepto">Concepto</label>
                            <input type="text" id="concepto" placeholder="Ej. Venta de consola" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="monto">Monto</label>
                            <input type="number" id="monto" placeholder="Ej. 2000" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="tipo">Tipo de Movimiento</label>
                            <select id="tipo" required>
                                <option value="2">Ingreso</option>
                                <option value="1">Egreso</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn-success">
                            Guardar Movimiento
                        </button>
                        
                        <button type="button" onclick="ocultarFormulario()" style="width: 100%; padding: 12px; background-color: #6b7280; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px;">
                            Cerrar / Cancelar
                        </button>

                        <p id="msg-status" class="msg-status"></p>
                    </form>
                </div>

                <div class="tabla-container">
                    <h3>Últimos Movimientos</h3>
                    <table class="tabla-movimientos">
                        <thead>
                            <tr>
                                <th>Concepto</th>
                                <th>Monto</th>
                                <th>Tipo</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-movimientos">
                            </tbody>
                    </table>

                    <button id="btnMostrarFormulario" onclick="mostrarFormulario()" style="width: 100%; padding: 12px; background-color: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 25px; font-size: 1rem;">
                        ➕ Registrar Nuevo Movimiento
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="js/ingreso_config.js"></script>
    <script>function logout(){ localStorage.removeItem("token"); window.location.href="usuario_index.html"; }</script>
</body>
</html>
